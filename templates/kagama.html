        function waitForClass(selector, className) {
          return new Promise((resolve) => {
            const element = document.querySelector(selector);
            if (element && element.classList.contains(className)) {
              return resolve(element);
            }
            const observer = new MutationObserver((mutations, obs) => {
              const el = document.querySelector(selector);
              if (el && el.classList.contains(className)) {
                obs.disconnect();
                resolve(el);
              }
            });
            observer.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['class']
            });
          });
        }

        <script>
        (function() {
           var banner = document.getElementById("kg-standalone-banner");
           if (!banner) return;

           var closeButton = banner.querySelector(".kg-standalone-banner__close");
           var launchButton = banner.querySelector(".kg-standalone-banner__btn--launch");

           function getGameId() {
              var match = window.location.pathname.match(/\/games\/play\/(\d+)/);
              return match ? match[1] : null;
           }

           function isStandaloneParam() {
              return window.location.search.indexOf("standalone=1") !== -1;
           }

           function closeBanner() {
              banner.style.display = "none";
              try { sessionStorage.setItem("kg-standalone-dismissed", "1"); } catch(e) {}
           }

           function launchStandalone(gameId) {
              window.location.href = "kogama2-www://" + window.location.host + "/games/play/" + gameId;
           }

           function showBanner() {
              banner.style.display = "block";
           }

           if (closeButton) {
              closeButton.addEventListener("click", closeBanner);
           }

           if (launchButton) {
              launchButton.addEventListener("click", function() {
                 var gameId = getGameId();
                 if (gameId) {
                    launchStandalone(gameId);
                 }
              });
           }

           function init() {
              var gameId = getGameId();
              if (!gameId) return;

              if (isStandaloneParam()) {
                 launchStandalone(gameId);
                 showBanner();
                 return;
              }

          var lastPopupState = false;

          function checkForPopup() {
             /* Find the MUI dialog overlay (backdrop class) */
             var popup = document.querySelector('.FA7nk');
             if (!popup) return;

             var dialog = popup.querySelector('._2IXcc') || popup.querySelector('[class*="popupDialog"]');
             if (!dialog) return;

             var isVisible = popup.offsetParent !== null || getComputedStyle(popup).display !== 'none';

             if (isVisible && !lastPopupState) {
                /* Popup just opened */
                lastPopupState = true;
                animatePopupEntrance(dialog);
             } else if (!isVisible && lastPopupState) {
                /* Popup just closed */
                lastPopupState = false;
                dialog.classList.remove('badge-anim-pop', 'badge-anim-closing');
             }
          }

          function checkForBadgeGrid() {
             /* Find badge grid containers */
             var wrappers = document.querySelectorAll('[class*="badgesWrapper"]');
             for (var i = 0; i < wrappers.length; i++) {
                staggerBadges(wrappers[i]);
             }
          }

          function checkForBadgeClicks() {
             /* Attach click handlers to badge items */
             var badges = document.querySelectorAll('[class*="bd"]');
             for (var i = 0; i < badges.length; i++) {
                var badge = badges[i];
                if (badge._animBound) continue;
                badge._animBound = true;
                var parent = badge.closest('[class*="badge"]');
                if (parent) {
                   badge.addEventListener('click', function() {
                      animateBadgeClick(parent);
                   });
                }
             }
          }

          function runBadgeAnimChecks() {
             checkForPopup();
             checkForBadgeGrid();
             checkForBadgeClicks();
          }

          /* Observe DOM changes — disconnect after 5s to avoid freezing */
          var observer = new MutationObserver(function() {
             runBadgeAnimChecks();
          });

          if (document.body) {
             observer.observe(document.body, { childList: true, subtree: true });
          }
          setTimeout(function() { observer.disconnect(); }, 5000);

          /* Also intercept the close button for animated close */
          document.addEventListener('click', function(e) {
             var closeBtn = e.target.closest('[aria-label="close"]');
             if (closeBtn) {
                var dialog = closeBtn.closest('._2IXcc') || closeBtn.closest('[class*="popupDialog"]');
                if (dialog && dialog.classList.contains('badge-anim-pop')) {
                   e.stopPropagation();
                   e.preventDefault();
                   animatePopupClose(dialog);
                }
             }
          }, true);

          /* Initial check + periodic fallback */
          setTimeout(runBadgeAnimChecks, 1000);
          setTimeout(runBadgeAnimChecks, 3000);
          setInterval(runBadgeAnimChecks, 10000);
       })();
       </script>
